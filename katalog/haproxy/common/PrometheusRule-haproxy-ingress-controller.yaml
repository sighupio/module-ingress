---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: haproxy-ingress-controller
  namespace: ingress-haproxy
  labels:
    app.kubernetes.io/name: kubernetes-ingress
    app.kubernetes.io/instance: haproxy-ingress
    app.kubernetes.io/component: controller
    k8s-app: haproxy-ingress
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: haproxy-ingress
      rules:
        # Reshapes kube_ingress_path (one row per Ingress path) into the same (svc_namespace, svc_service)
        # key that HAProxy backends use, so it can be looked up by backend_to_ingress below.
        # kube_ingress_path.service_port is not used in the match because kube-state-metrics reports
        # it as "0" for named Ingress backend ports, while HAProxy's proxy label carries the name.
        - record: haproxy_ingress:backend_to_ingress_candidate
          expr: |
            max by (svc_namespace, svc_service, ingress, host) (
              label_replace(
                label_replace(kube_ingress_path, "svc_namespace", "$1", "namespace", "(.*)"),
                "svc_service", "$1", "service_name", "(.*)"
              )
            )

        # Given a backend's (svc_namespace, svc_service), returns its Ingress (ingress, host).
        # Same Service targeted by multiple Ingresses fall back to the original HAProxy labels.
        - record: haproxy_ingress:backend_to_ingress
          expr: |
            haproxy_ingress:backend_to_ingress_candidate
              and on (svc_namespace, svc_service)
            (
              count by (svc_namespace, svc_service) (haproxy_ingress:backend_to_ingress_candidate) == 1
            )

        # Single source of truth for svc_namespace/svc_service, derived once from a metric that
        # always exists for every configured backend regardless of traffic (haproxy_backend_status).
        # Normalized to a constant 1 ("* 0 + 1") so joining it below via group_left never changes
        # the value of the metric it's attached to.
        - record: haproxy_ingress:proxy_svc_labels
          expr: |
            label_replace(label_replace(
              count by (job, proxy) (haproxy_backend_status{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}) * 0 + 1,
              "svc_namespace", "$1", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$"),
              "svc_service", "$2", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$")

        # Given a HAProxy backend's (job, proxy), returns its Ingress (ingress, host).
        - record: haproxy_ingress:proxy_to_ingress
          expr: |
            haproxy_ingress:proxy_svc_labels
              * on (svc_namespace, svc_service) group_left (ingress, host)
            haproxy_ingress:backend_to_ingress

        - record: haproxy_ingress:http_4xx_error_rate_backend
          expr: |
            (
              (sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",code=~"4.."}[2m])) /
               sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
            )
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:http_5xx_error_rate_backend
          expr: |
            (
              (sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",code=~"5.."}[2m])) /
               sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
            )
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:server_response_error_rate
          expr: |
            (
              (sum by (job, proxy, server) (rate(haproxy_server_response_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m])) /
               sum by (job, proxy, server) (rate(haproxy_server_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
            )
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:backend_connection_errors_rate
          expr: |
            sum by (job, proxy) (rate(haproxy_backend_connection_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[1m]))
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:backend_alive_servers_total
          expr: |
            (haproxy_backend_active_servers{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"} + haproxy_backend_backup_servers{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"})
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:backend_pending_requests
          expr: |
            sum by (job, proxy) (haproxy_backend_current_queue{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"})
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:backend_latency_avg_5m
          expr: |
            max_over_time(haproxy_backend_response_time_average_seconds{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[5m])
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:backend_latency_total_5m
          expr: |
            max_over_time(haproxy_backend_total_time_average_seconds{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[5m])
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - record: haproxy_ingress:server_healthcheck_failures_5m
          expr: |
            increase(haproxy_server_check_failures_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[5m])
              * on (job, proxy) group_left (svc_namespace, svc_service) haproxy_ingress:proxy_svc_labels

        - alert: HaproxyIngressTargetDown
          expr: absent(up{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"} == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: HAProxy Ingress metrics target down ({{ $labels.namespace }})
            description: Prometheus cannot scrape haproxy-ingress metrics endpoints for 15 minutes.
            doc: This alert fires if Prometheus target discovery was not able to reach haproxy-ingress metrics in the last 15 minutes.

        - alert: HaproxyHighHttp4xxErrorRateBackend
          expr: |
            (
              haproxy_ingress:http_4xx_error_rate_backend
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:http_4xx_error_rate_backend
            ) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy backend high 4xx rate ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Too many HTTP 4xx responses (>10%) on backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires if the 4xx error rate measured on a 2 minute window exceeds 10% for 5 minutes.

        - alert: HaproxyHighHttp5xxErrorRateBackend
          expr: |
            (
              haproxy_ingress:http_5xx_error_rate_backend
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:http_5xx_error_rate_backend
            ) > 10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'HAProxy backend high 5xx rate ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Too many HTTP 5xx responses (>10%) on backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires if the 5xx error rate measured on a 2 minute window exceeds 10% for 10 minutes.

        - alert: HaproxyServerResponseErrors
          expr: |
            (
              haproxy_ingress:server_response_error_rate
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy, server)
              haproxy_ingress:server_response_error_rate
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy server response errors ({{ $labels.proxy }}/{{ $labels.server }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Response errors exceed 5% on server {{ $labels.proxy }}/{{ $labels.server }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires if a specific backend server has response error rate exceeding 5% for 5 minutes.

        - alert: HaproxyBackendConnectionErrors
          expr: |
            (
              haproxy_ingress:backend_connection_errors_rate
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:backend_connection_errors_rate
            ) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy backend connection errors ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }} sees more than 100 connection errors per second.'
            doc: This alert fires if connection errors exceed 100 per second for 5 minutes on a backend.

        - alert: HaproxyBackendNoAliveServers
          expr: |
            (
              haproxy_ingress:backend_alive_servers_total
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:backend_alive_servers_total
            ) == 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: 'HAProxy backend has no alive servers ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'No active or backup servers available on backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires immediately when a backend has no healthy servers available.

        - alert: HaproxyBackendPendingRequests
          expr: |
            (
              haproxy_ingress:backend_pending_requests
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:backend_pending_requests
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy backend pending requests ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Requests are pending in queue for backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires if requests have been queued for a backend for more than 5 minutes.

        - alert: HaproxyFrontendSecurityBlockedRequests
          expr: sum by (job, proxy) (rate(haproxy_frontend_denied_connections_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m])) > 10
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: HAProxy frontend security blocked requests ({{ $labels.proxy }})
            description: Security rules are blocking requests on frontend {{ $labels.proxy }}.
            doc: This alert fires if more than 10 connections per second are being denied on a frontend for 2 minutes.

        - alert: HaproxyBackendLatencyHigh
          expr: |
            (
              haproxy_ingress:backend_latency_avg_5m
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:backend_latency_avg_5m
            ) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy backend latency high ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Average response time for backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }} exceeded 5s.'
            doc: This alert fires if average backend response time exceeds 5 seconds for 10 minutes.

        - alert: HaproxyBackendLatencyCritical
          expr: |
            (
              haproxy_ingress:backend_latency_total_5m
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              haproxy_ingress:backend_latency_total_5m
            ) > 10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'HAProxy backend latency critical ({{ $labels.proxy }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Average total time for backend {{ $labels.proxy }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }} exceeded 10s.'
            doc: This alert fires if average total time (including queue time) exceeds 10 seconds for 10 minutes.

        - alert: HaproxyServerHealthcheckFailure
          expr: |
            (
              haproxy_ingress:server_healthcheck_failures_5m
                * on (job, proxy) group_left (ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy, server)
              haproxy_ingress:server_healthcheck_failures_5m
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'HAProxy server healthcheck failures ({{ $labels.server }}){{ if $labels.ingress }} [ns: {{ $labels.svc_namespace }}/{{ $labels.ingress }}]{{ end }}'
            description: 'Health checks are failing for server {{ $labels.server }}{{ if $labels.ingress }} (namespace: {{ $labels.svc_namespace }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}){{ end }}.'
            doc: This alert fires if health check failures are detected for a server over a 5 minute period.

        - alert: HaproxyIngressConfigSyncFailed
          expr: haproxy_unable_to_sync_configuration{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: HAProxy Ingress configuration sync failed
            description: HAProxy Ingress has a pending configuration that is not valid.
            doc: This alert fires if the ingress configuration sync failed in the last 10 minutes.
