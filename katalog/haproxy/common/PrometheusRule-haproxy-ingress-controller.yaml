---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: haproxy-ingress-controller
  namespace: ingress-haproxy
  labels:
    app.kubernetes.io/name: kubernetes-ingress
    app.kubernetes.io/instance: haproxy-ingress
    app.kubernetes.io/component: controller
    k8s-app: haproxy-ingress
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: haproxy-ingress
      rules:
        # Reshapes kube_ingress_path (one row per Ingress path) into the same (namespace, svc_service)
        # key that HAProxy backends use, so it can be looked up by backend_to_ingress below.
        # kube_ingress_path.service_port is not used in the match because kube-state-metrics reports
        # it as "0" for named Ingress backend ports, while HAProxy's proxy label carries the name.
        - record: haproxy_ingress:backend_to_ingress_candidate
          expr: |
            max by (namespace, svc_service, ingress, host) (
              label_replace(kube_ingress_path, "svc_service", "$1", "service_name", "(.*)")
            )

        # Given a backend's (namespace, svc_service), returns its Ingress and Host
        # Same Service targeted by multiple Ingresses fall back to the original HAProxy labels.
        - record: haproxy_ingress:backend_to_ingress
          expr: |
            haproxy_ingress:backend_to_ingress_candidate
              and on (namespace, svc_service)
            (
              count by (namespace, svc_service) (haproxy_ingress:backend_to_ingress_candidate) == 1
            )

        # Single source of truth for namespace/svc_service, derived once from a metric that
        # always exists for every configured backend regardless of traffic (haproxy_backend_status).
        # Normalized to a constant 1 ("* 0 + 1") so joining it below via group_left never changes
        # the value of the metric it's attached to.
        - record: haproxy_ingress:proxy_svc_labels
          expr: |
            label_replace(label_replace(
              count by (job, proxy) (haproxy_backend_status{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}) * 0 + 1,
              "namespace", "$1", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$"),
              "svc_service", "$2", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$")

        # Given a HAProxy backend's (job, proxy), returns its Ingress and Host
        - record: haproxy_ingress:proxy_to_ingress
          expr: |
            haproxy_ingress:proxy_svc_labels
              * on (namespace, svc_service) group_left (ingress, host)
            haproxy_ingress:backend_to_ingress

        - alert: HaproxyIngressHighHttp5xxErrorRateBackend
          expr: |
            (
              (
                (sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",code=~"5.."}[2m])) /
                 sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
              )
                * on (job, proxy) group_left (namespace, svc_service, ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              (
                (sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",code=~"5.."}[2m])) /
                 sum by (job, proxy) (rate(haproxy_backend_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
              )
                * on (job, proxy) group_left (namespace, svc_service) haproxy_ingress:proxy_svc_labels
            ) > 10
          for: 10m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: 'HAProxy backend high 5xx rate ({{ $labels.proxy }}){{ if $labels.namespace }} [ns: {{ $labels.namespace }}{{ if $labels.ingress }}/{{ $labels.ingress }}{{ end }}]{{ end }}'
            description: 'Too many HTTP 5xx responses (>10%) on backend {{ $labels.proxy }}{{ if $labels.namespace }} (namespace: {{ $labels.namespace }}{{ if $labels.ingress }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}{{ end }}){{ end }}.'
            doc: This alert fires if the 5xx error rate measured on a 2 minute window exceeds 10% for 10 minutes.

        - alert: HaproxyIngressServerResponseErrors
          expr: |
            (
              (
                (sum by (job, proxy, server) (rate(haproxy_server_response_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m])) /
                 sum by (job, proxy, server) (rate(haproxy_server_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
              )
                * on (job, proxy) group_left (namespace, svc_service, ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy, server)
              (
                (sum by (job, proxy, server) (rate(haproxy_server_response_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m])) /
                 sum by (job, proxy, server) (rate(haproxy_server_http_responses_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m]))) * 100
              )
                * on (job, proxy) group_left (namespace, svc_service) haproxy_ingress:proxy_svc_labels
            ) > 5
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: 'HAProxy server response errors ({{ $labels.proxy }}/{{ $labels.server }}){{ if $labels.namespace }} [ns: {{ $labels.namespace }}{{ if $labels.ingress }}/{{ $labels.ingress }}{{ end }}]{{ end }}'
            description: 'Response errors exceed 5% on server {{ $labels.proxy }}/{{ $labels.server }}{{ if $labels.namespace }} (namespace: {{ $labels.namespace }}{{ if $labels.ingress }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}{{ end }}){{ end }}.'
            doc: This alert fires if a specific backend server has response error rate exceeding 5% for 5 minutes.

        - alert: HaproxyIngressBackendConnectionErrors
          expr: |
            (
              sum by (job, proxy) (rate(haproxy_backend_connection_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[1m]))
                * on (job, proxy) group_left (namespace, svc_service, ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              sum by (job, proxy) (rate(haproxy_backend_connection_errors_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[1m]))
                * on (job, proxy) group_left (namespace, svc_service) haproxy_ingress:proxy_svc_labels
            ) > 100
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: 'HAProxy backend connection errors ({{ $labels.proxy }}){{ if $labels.namespace }} [ns: {{ $labels.namespace }}{{ if $labels.ingress }}/{{ $labels.ingress }}{{ end }}]{{ end }}'
            description: 'Backend {{ $labels.proxy }}{{ if $labels.namespace }} (namespace: {{ $labels.namespace }}{{ if $labels.ingress }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}{{ end }}){{ end }} sees more than 100 connection errors per second.'
            doc: This alert fires if connection errors exceed 100 per second for 5 minutes on a backend.

        - alert: HaproxyIngressBackendPendingRequests
          expr: |
            (
              sum by (job, proxy) (haproxy_backend_current_queue{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"})
                * on (job, proxy) group_left (namespace, svc_service, ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy)
              sum by (job, proxy) (haproxy_backend_current_queue{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"})
                * on (job, proxy) group_left (namespace, svc_service) haproxy_ingress:proxy_svc_labels
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: 'HAProxy backend pending requests ({{ $labels.proxy }}){{ if $labels.namespace }} [ns: {{ $labels.namespace }}{{ if $labels.ingress }}/{{ $labels.ingress }}{{ end }}]{{ end }}'
            description: 'Requests are pending in queue for backend {{ $labels.proxy }}{{ if $labels.namespace }} (namespace: {{ $labels.namespace }}{{ if $labels.ingress }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}{{ end }}){{ end }}.'
            doc: This alert fires if requests have been queued for a backend for more than 5 minutes.

        - alert: HaproxyIngressServerHealthcheckFailure
          expr: |
            (
              label_replace(
                max without (namespace) (haproxy_server_status{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",state="DOWN"}),
                "namespace", "$1", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$"
              )
                * on (job, proxy) group_left (svc_service, ingress, host) haproxy_ingress:proxy_to_ingress
              or on (job, proxy, server)
              label_replace(
                max without (namespace) (haproxy_server_status{job=~"haproxy-ingress(-internal|-external)?(-metrics)?",state="DOWN"}),
                "namespace", "$1", "proxy", "^([a-z0-9-]+)_svc_([a-z0-9-]+)_([a-z0-9-]+)$"
              )
                * on (job, proxy) group_left (svc_service) haproxy_ingress:proxy_svc_labels
            ) == 1
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: 'HAProxy server down ({{ $labels.server }}){{ if $labels.namespace }} [ns: {{ $labels.namespace }}{{ if $labels.ingress }}/{{ $labels.ingress }}{{ end }}]{{ end }}'
            description: 'Server {{ $labels.server }} is DOWN{{ if $labels.namespace }} (namespace: {{ $labels.namespace }}{{ if $labels.ingress }}, ingress: {{ $labels.ingress }}, host: {{ $labels.host }}{{ end }}){{ end }}.'
            doc: This alert fires if a HAProxy backend server remains DOWN for 5 minutes.

        - alert: HaproxyIngressConfigSyncFailed
          expr: haproxy_unable_to_sync_configuration{job=~"haproxy-ingress(-internal|-external)?-admin"} == 1
          for: 10m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: HAProxy Ingress configuration sync failed
            description: HAProxy Ingress has a pending configuration that is not valid.
            doc: This alert fires if the ingress configuration sync failed in the last 10 minutes.

        - alert: HaproxyIngressTargetDown
          expr: absent(up{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"} == 1)
          for: 15m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: HAProxy Ingress metrics target down ({{ $labels.namespace }})
            description: Prometheus cannot scrape haproxy-ingress metrics endpoints for 15 minutes.
            doc: This alert fires if Prometheus target discovery was not able to reach haproxy-ingress metrics in the last 15 minutes.

        - alert: HaproxyIngressFrontendSecurityBlockedRequests
          expr: sum by (job, proxy) (rate(haproxy_frontend_denied_connections_total{job=~"haproxy-ingress(-internal|-external)?(-metrics)?"}[2m])) > 10
          for: 2m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: HAProxy Ingress denied TCP connections ({{ $labels.proxy }})
            description: HAProxy Ingress is denying TCP connections on the {{ $labels.proxy }} frontend before Ingress routing.
            doc: This alert fires if tcp-request connection rules deny more than 10 connections per second on a frontend for 2 minutes.
